events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 10m;

    # Upstream for Frontend (running in separate container on same network)
    upstream frontend {
        server frontend:3000;
    }

    # HTTP server — serves ACME challenges, redirects everything else to HTTPS
    server {
        listen 80;
        server_name goldenduck.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server — only active when certs exist
    server {
        listen 443 ssl;
        server_name goldenduck.online;

        ssl_certificate /etc/letsencrypt/live/goldenduck.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/goldenduck.online/privkey.pem;

        # SSL best practices
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
